# Keeps the geoip branch on DB-IP's latest "IP to City Lite" and "IP to ASN Lite" releases (CC BY 4.0,
# https://db-ip.com). Checks every day; only when DB-IP published a new month does it convert them
# (tools/dbip-convert.py) and replace the branch with a single commit, so the repository does not grow month after
# month. Collectors with IP_GEO=1 or IP_ASN=1 read VERSION from that branch and download the files when it changes.
name: geoip

on:
  schedule:
    - cron: '23 5 * * *'
  # a new converter changes the files: rebuild without waiting for the next day
  push:
    branches: [main]
    paths: [tools/dbip-convert.py, .github/workflows/geoip.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest DB-IP release
        id: src
        run: |
          set -eu
          # the month's files appear on the 1st; fall back to the previous month until both do
          for m in "$(date -u +%Y-%m)" "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"; do
            city="https://download.db-ip.com/free/dbip-city-lite-$m.csv.gz"
            asn="https://download.db-ip.com/free/dbip-asn-lite-$m.csv.gz"
            mod=$(curl -sfI -m 30 "$city" | tr -d '\r' | sed -n 's/^last-modified: //Ip' || true)
            if [ -n "$mod" ] && curl -sfI -m 30 "$asn" > /dev/null; then
              echo "city=$city" >> "$GITHUB_OUTPUT"
              echo "asn=$asn" >> "$GITHUB_OUTPUT"
              # + the converter's hash: a change to the converter rebuilds the branch too
              echo "version=$m $mod $(sha256sum tools/dbip-convert.py | cut -c1-8)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no DB-IP lite files found"
          exit 1

      - name: Compare with the geoip branch
        id: cmp
        run: |
          current=$(git fetch -q origin geoip 2>/dev/null && git show origin/geoip:VERSION 2>/dev/null || true)
          echo "current: ${current:-none}"
          echo "latest:  ${{ steps.src.outputs.version }}"
          [ "$current" = "${{ steps.src.outputs.version }}" ] && echo "new=0" >> "$GITHUB_OUTPUT" || echo "new=1" >> "$GITHUB_OUTPUT"

      - name: Convert and publish
        if: steps.cmp.outputs.new == '1'
        run: |
          set -eu
          curl -sf -m 600 -o city.csv.gz "${{ steps.src.outputs.city }}"
          curl -sf -m 600 -o asn.csv.gz "${{ steps.src.outputs.asn }}"
          python3 tools/dbip-convert.py city city.csv.gz out
          python3 tools/dbip-convert.py asn asn.csv.gz out
          xz -9 -T0 out/ranges.tsv out/locations.tsv out/asn-ranges.tsv out/asn-names.tsv
          echo "${{ steps.src.outputs.version }}" > out/VERSION
          cat > out/README.md <<'MD'
          # relay_tracking geoip data

          IP to location (`IP_GEO=1`) and IP to network owner (`IP_ASN=1`) data for the relay_tracking collectors,
          rebuilt from [DB-IP](https://db-ip.com)'s free "IP to City Lite" and "IP to ASN Lite" databases by
          `tools/dbip-convert.py` on the main branch.

          IP Geolocation by DB-IP, licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).
          Changes: coordinates and continent dropped, neighbouring ranges with the same location merged, range starts
          only (see the converter for the format).
          MD
          cd out
          git init -q -b geoip
          git config user.name "P6g9YHK6"
          git config user.email "17877371+P6g9YHK6@users.noreply.github.com"
          git add -A
          git commit -q -m "dbip city and asn lite $(cut -d' ' -f1 VERSION)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" geoip
          ls -la
